app-id: io.github.mariocesar.Pad
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: pad
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # pad FILE opens files anywhere in home.
  - --filesystem=home
  # Brings over the settings of a non-Flatpak install.
  - --metadata=X-DConf=migrate-path=/io/github/mariocesar/Pad/
modules:
  - name: pad
    buildsystem: meson
    sources:
      - type: dir
        path: .
