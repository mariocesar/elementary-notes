name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Needs GTK 4.20, newer than Ubuntu has.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed gcc git pkgconf meson vala gtk4 gtksourceview5 desktop-file-utils appstream dbus xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@v7
      - run: meson setup build
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: pad.flatpak
          manifest-path: io.github.mariocesar.Pad.yml
          run-tests: true
          cache-key: flatpak-builder-${{ github.sha }}

  lint:
    runs-on: ubuntu-latest
    container: valalang/lint
    steps:
      - uses: actions/checkout@v7
      - run: io.elementary.vala-lint -d .
