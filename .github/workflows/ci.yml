name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Needs GTK 4.20, newer than Ubuntu has.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed gcc git pkgconf meson vala gtk4 gtksourceview5 desktop-file-utils appstream dbus xorg-server-xvfb xorg-xauth
      - uses: actions/checkout@v7
      - run: meson setup build
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs

  lint:
    runs-on: ubuntu-latest
    container: valalang/lint
    steps:
      - uses: actions/checkout@v7
      - run: io.elementary.vala-lint -d .
